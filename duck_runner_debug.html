<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duck Runner - DEBUG VERSION</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #87CEEB;
            font-family: Arial, sans-serif;
        }
        #game-container {
            border: 3px solid #333;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .instructions {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }
    </style>
</head>
<body>
    <div>
        <div class="instructions">
            <h2>🦆 Duck Runner - DEBUG VERSION 🦆</h2>
            <p>Press SPACEBAR to jump! Look for the BIG YELLOW SQUARE DUCK!</p>
        </div>
        <div id="game-container"></div>
    </div>

    <script>
        class GameScene extends Phaser.Scene {
            constructor() {
                super({ key: 'GameScene' });
                this.player = null;
                this.platforms = null;
                this.obstacles = null;
                this.coins = null;
                this.score = 0;
                this.distance = 0;
                this.scoreText = null;
                this.debugText = null;
                this.gameSpeed = 150;
                this.jumpPower = 500;
                this.isJumping = false;
                this.obstacleTimer = 0;
                this.coinTimer = 0;
            }

            preload() {
                // Create SUPER SIMPLE sprites that MUST work
                this.createSimpleAssets();
            }

            createSimpleAssets() {
                console.log("Creating assets...");
                
                // HUGE YELLOW DUCK - just a big yellow rectangle
                this.add.graphics()
                    .fillStyle(0xFFFF00)  // Bright yellow
                    .fillRect(0, 0, 50, 40)  // Big rectangle
                    .generateTexture('duck', 50, 40);
                
                console.log("Duck texture created");

                // Simple ground - brown rectangle
                this.add.graphics()
                    .fillStyle(0x8B4513)
                    .fillRect(0, 0, 64, 64)
                    .generateTexture('ground', 64, 64);

                // Simple obstacle - red rectangle
                this.add.graphics()
                    .fillStyle(0xFF0000)  // Bright red
                    .fillRect(0, 0, 40, 40)
                    .generateTexture('obstacle', 40, 40);

                // Simple coin - green circle
                this.add.graphics()
                    .fillStyle(0x00FF00)  // Bright green
                    .fillCircle(15, 15, 15)
                    .generateTexture('coin', 30, 30);
                
                console.log("All textures created");
            }

            create() {
                console.log("Creating game scene...");
                
                // Create physics groups
                this.platforms = this.physics.add.staticGroup();
                this.obstacles = this.physics.add.group();
                this.coins = this.physics.add.group();

                // Create ground
                for (let x = 0; x < 1600; x += 64) {
                    const ground = this.platforms.create(x, 568, 'ground');
                    ground.setScale(1).refreshBody();
                }

                // Create player duck - VERY OBVIOUS POSITION
                this.player = this.physics.add.sprite(100, 500, 'duck');
                this.player.setBounce(0);
                this.player.setCollideWorldBounds(true);
                this.player.body.setSize(45, 35);
                this.player.setTint(0xFFFF00); // Extra yellow tint
                
                console.log("Duck created at:", this.player.x, this.player.y);
                console.log("Duck visible:", this.player.visible);
                console.log("Duck texture:", this.player.texture.key);

                // Player collisions
                this.physics.add.collider(this.player, this.platforms);
                this.physics.add.collider(this.player, this.obstacles, this.hitObstacle, null, this);
                this.physics.add.overlap(this.player, this.coins, this.collectCoin, null, this);

                // Controls
                this.spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);

                // UI with LOTS of debug info
                this.scoreText = this.add.text(16, 16, 'Score: 0\nDistance: 0m', {
                    fontSize: '16px',
                    fill: '#000',
                    backgroundColor: '#fff',
                    padding: { x: 8, y: 4 }
                });
                this.scoreText.setScrollFactor(0);

                // DEBUG INFO
                this.debugText = this.add.text(16, 100, '', {
                    fontSize: '12px',
                    fill: '#000',
                    backgroundColor: '#ffff99',
                    padding: { x: 5, y: 5 }
                });
                this.debugText.setScrollFactor(0);

                // Big instruction
                this.add.text(400, 50, 'SPACEBAR = JUMP! Look for YELLOW SQUARE!', {
                    fontSize: '18px',
                    fill: '#000',
                    backgroundColor: '#ffff00',
                    padding: { x: 10, y: 5 }
                }).setOrigin(0.5, 0).setScrollFactor(0);

                console.log("Scene created successfully");
            }

            update(time, delta) {
                // Update distance and score
                this.distance += this.gameSpeed * delta / 1000;
                this.score = Math.floor(this.distance);

                // Update UI
                this.scoreText.setText(`Score: ${this.score}\nDistance: ${Math.floor(this.distance)}m`);
                
                // DEBUG INFO - show everything about the duck
                if (this.player) {
                    this.debugText.setText(`DUCK DEBUG:
X: ${Math.round(this.player.x)}
Y: ${Math.round(this.player.y)}
Visible: ${this.player.visible}
On Ground: ${this.player.body.touching.down}
Camera X: ${Math.round(this.cameras.main.scrollX)}
Texture: ${this.player.texture.key}`);
                }

                // Handle jumping
                if (this.spaceKey.isDown && this.player.body.touching.down) {
                    this.player.setVelocityY(-this.jumpPower);
                    console.log("DUCK JUMPED!");
                }

                // Move camera to follow
                this.cameras.main.scrollX += this.gameSpeed * delta / 1000;

                // Spawn obstacles occasionally
                this.obstacleTimer += delta;
                if (this.obstacleTimer > 3000) {
                    const spawnX = this.cameras.main.scrollX + 800;
                    const obstacle = this.obstacles.create(spawnX, 528, 'obstacle');
                    obstacle.setVelocityX(-this.gameSpeed);
                    obstacle.body.setImmovable(true);
                    this.obstacleTimer = 0;
                    console.log("Obstacle spawned at", spawnX);
                }

                // Spawn coins occasionally
                this.coinTimer += delta;
                if (this.coinTimer > 4000) {
                    const spawnX = this.cameras.main.scrollX + 800;
                    const coin = this.coins.create(spawnX, 450, 'coin');
                    coin.setVelocityX(-this.gameSpeed);
                    this.coinTimer = 0;
                    console.log("Coin spawned at", spawnX);
                }

                // Clean up old objects
                this.obstacles.children.entries.forEach(obstacle => {
                    if (obstacle.x < this.cameras.main.scrollX - 200) {
                        obstacle.destroy();
                    }
                });

                this.coins.children.entries.forEach(coin => {
                    if (coin.x < this.cameras.main.scrollX - 200) {
                        coin.destroy();
                    }
                });
            }

            hitObstacle() {
                console.log("HIT OBSTACLE!");
                this.physics.pause();
                this.player.setTint(0xff0000);
                
                const gameOverText = this.add.text(400, 250, 'GAME OVER!\nPress R to Restart', {
                    fontSize: '32px',
                    fill: '#ff0000',
                    backgroundColor: '#fff',
                    padding: { x: 20, y: 10 },
                    align: 'center'
                });
                gameOverText.setOrigin(0.5);
                gameOverText.setScrollFactor(0);

                this.rKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.R);
                this.rKey.on('down', () => {
                    this.scene.restart();
                });
            }

            collectCoin(player, coin) {
                console.log("COIN COLLECTED!");
                coin.destroy();
                this.score += 50;
            }
        }

        // Game configuration
        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            parent: 'game-container',
            backgroundColor: '#87CEEB',
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 1200 },
                    debug: false  // Set to true to see collision boxes
                }
            },
            scene: GameScene
        };

        console.log("Starting Phaser game...");
        const game = new Phaser.Game(config);
    </script>
</body>
</html>
