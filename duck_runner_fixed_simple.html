<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duck Runner - Fixed</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #87CEEB;
            font-family: Arial, sans-serif;
        }
        #game-container {
            border: 3px solid #333;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .instructions {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }
    </style>
</head>
<body>
    <div>
        <div class="instructions">
            <h2>🦆 Duck Runner - Advanced Edition 🦆</h2>
            <p>SPACE: Jump/Double Jump | HOLD DOWN: Slide | G: Gamble</p>
            <p>🧲 Green = Magnet | 🛡️ Blue = Shield | 🎰 Purple = Gamble Orb</p>
        </div>
        <div id="game-container"></div>
    </div>

    <script>
        class GameScene extends Phaser.Scene {
            constructor() {
                super({ key: 'GameScene' });
            }

            init() {
                // Initialize all variables here
                this.player = null;
                this.platforms = null;
                this.obstacles = null;
                this.coins = null;
                this.score = 0;
                this.distance = 0;
                this.scoreText = null;
                this.gameSpeed = 200;
                this.jumpPower = 600;
                this.nextObstacleX = 600;
                this.nextCoinX = 400;
                
                // Advanced mechanics (no lanes)
                this.isSliding = false;
                this.hasDoubleJump = true;
                this.isInvincible = false;
                this.magnetActive = false;
                this.nextPowerUpX = 1000;
                this.nextGambleX = 1500;
                this.powerUps = null;
                this.gambleOrbs = null;
                this.betPlaced = false;
            }

            preload() {
                this.createAssets();
            }

            createAssets() {
                // Duck sprite
                this.add.graphics()
                    .fillStyle(0xFFFF00)
                    .fillRect(0, 0, 50, 40)
                    .fillStyle(0xFF8C00)
                    .fillTriangle(0, 20, 15, 15, 15, 25)
                    .fillStyle(0x000000)
                    .fillCircle(35, 15, 3)
                    .generateTexture('duck', 50, 40);

                // Ground tile
                this.add.graphics()
                    .fillStyle(0x8B4513)
                    .fillRect(0, 0, 64, 64)
                    .generateTexture('ground', 64, 64);

                // Low obstacles
                this.add.graphics()
                    .fillStyle(0xFF0000)
                    .fillRect(0, 0, 40, 40)
                    .generateTexture('low_obstacle', 40, 40);

                // High obstacles
                this.add.graphics()
                    .fillStyle(0xFF0000)
                    .fillRect(0, 0, 40, 80)
                    .generateTexture('high_obstacle', 40, 80);

                // Coins
                this.add.graphics()
                    .fillStyle(0xFFD700)
                    .fillCircle(15, 15, 15)
                    .generateTexture('coin', 30, 30);

                // Flying obstacle (horizontal bar)
                this.add.graphics()
                    .fillStyle(0xFF0000)
                    .fillRect(0, 0, 50, 20)
                    .generateTexture('flying_obstacle', 50, 20);

                // Power-ups: Magnet (green square)
                this.add.graphics()
                    .fillStyle(0x00FF00)
                    .fillRect(0, 0, 30, 30)
                    .fillStyle(0x004400)
                    .fillRect(5, 5, 20, 20)
                    .generateTexture('magnet', 30, 30);

                // Power-ups: Shield (blue circle)
                this.add.graphics()
                    .fillStyle(0x0000FF)
                    .fillCircle(15, 15, 15)
                    .fillStyle(0x4444FF)
                    .fillCircle(15, 15, 10)
                    .generateTexture('shield', 30, 30);

                // Gamble orb (magenta circle)
                this.add.graphics()
                    .fillStyle(0xFF00FF)
                    .fillCircle(15, 15, 15)
                    .fillStyle(0xFF44FF)
                    .fillCircle(15, 15, 10)
                    .generateTexture('gamble_orb', 30, 30);

                // Improved cloud (larger, more puffy)
                this.add.graphics()
                    .fillStyle(0xFFFFFF)
                    .fillCircle(100, 100, 80)
                    .fillCircle(150, 110, 60)
                    .fillCircle(60, 110, 60)
                    .fillCircle(100, 60, 70)
                    .fillCircle(130, 80, 50)
                    .generateTexture('cloud', 200, 200);

                // Improved hill (green layered)
                this.add.graphics()
                    .fillStyle(0x32CD32)
                    .fillRoundedRect(0, 0, 200, 100, 30)
                    .fillStyle(0x228B22)
                    .fillRoundedRect(20, 20, 160, 80, 20)
                    .fillStyle(0x006400)
                    .fillRoundedRect(50, 40, 100, 60, 10)
                    .generateTexture('hill', 200, 100);

                // Particle (yellow dot for effects)
                this.add.graphics()
                    .fillStyle(0xFFFF00)
                    .fillCircle(5, 5, 5)
                    .generateTexture('particle', 10, 10);
            }

            create() {
                // Set world bounds
                this.physics.world.setBounds(0, 0, 10000, 600);

                // Create physics groups
                this.platforms = this.physics.add.staticGroup();
                this.obstacles = this.physics.add.staticGroup();
                this.coins = this.physics.add.group();
                this.powerUps = this.physics.add.group();
                this.gambleOrbs = this.physics.add.group();

                // Create ground
                this.createGround();

                // Create player duck (single path, no lanes)
                this.player = this.physics.add.sprite(100, 500, 'duck');
                this.player.setBounce(0);
                this.player.setCollideWorldBounds(true);
                this.player.body.setSize(45, 35);
                this.player.setScale(1.2);
                this.player.setVelocityX(this.gameSpeed);

                // Collisions
                this.physics.add.collider(this.player, this.platforms);
                this.physics.add.collider(this.player, this.obstacles, this.hitObstacle, null, this);
                this.physics.add.overlap(this.player, this.coins, this.collectCoin, null, this);
                this.physics.add.overlap(this.player, this.powerUps, this.collectPowerUp, null, this);
                this.physics.add.overlap(this.player, this.gambleOrbs, this.triggerGamble, null, this);

                // Controls
                this.spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
                this.downKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.DOWN);
                this.gKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.G);

                // Parallax backgrounds (wide for infinite, no manual tilePosition)
                this.clouds = this.add.tileSprite(0, 0, 10000, 600, 'cloud').setScrollFactor(0.2);
                this.hills = this.add.tileSprite(0, 400, 10000, 200, 'hill').setScrollFactor(0.5);

                // Particle system for effects
                this.emitter = this.add.particles(0, 0, 'particle', { 
                    speed: 100, 
                    lifespan: 500, 
                    quantity: 10, 
                    scale: { start: 1, end: 0 } 
                });

                // Pre-run bet modal (pause until bet)
                this.physics.pause();
                const betModal = this.add.rectangle(400, 300, 400, 200, 0xFFFFFF).setScrollFactor(0);
                betModal.setStrokeStyle(3, 0x000000);
                const betText = this.add.text(400, 250, 'Bet 0.01 ETH to double if >1000m? (7% edge)', {
                    fontSize: '20px', 
                    fill: '#000',
                    align: 'center'
                }).setOrigin(0.5).setScrollFactor(0);
                const betButton = this.add.text(400, 320, '💰 Place Bet', {
                    fontSize: '24px', 
                    fill: '#00FF00',
                    backgroundColor: '#FFFF00',
                    padding: { x: 10, y: 5 }
                }).setOrigin(0.5).setScrollFactor(0).setInteractive();
                const skipButton = this.add.text(400, 360, 'Skip Bet', {
                    fontSize: '18px', 
                    fill: '#666666',
                    backgroundColor: '#DDDDDD',
                    padding: { x: 8, y: 4 }
                }).setOrigin(0.5).setScrollFactor(0).setInteractive();

                betButton.on('pointerdown', () => {
                    this.betPlaced = true;
                    betModal.destroy(); 
                    betText.destroy(); 
                    betButton.destroy();
                    skipButton.destroy();
                    this.physics.resume();
                    console.log("Bet placed! Game started.");
                });

                skipButton.on('pointerdown', () => {
                    this.betPlaced = false;
                    betModal.destroy(); 
                    betText.destroy(); 
                    betButton.destroy();
                    skipButton.destroy();
                    this.physics.resume();
                    console.log("Bet skipped! Game started.");
                });

                // Camera
                this.cameras.main.startFollow(this.player);
                this.cameras.main.setFollowOffset(-200, 0);

                // Duck run bob animation
                this.tweens.add({
                    targets: this.player,
                    y: this.player.y + 5,
                    duration: 300,
                    yoyo: true,
                    repeat: -1,
                    ease: 'Sine.easeInOut'
                });

                // UI
                this.scoreText = this.add.text(16, 16, 'Score: 0', {
                    fontSize: '18px',
                    fill: '#000',
                    backgroundColor: '#fff',
                    padding: { x: 10, y: 5 }
                });
                this.scoreText.setScrollFactor(0);

                console.log("Game setup complete - waiting for bet decision!");
            }

            createGround() {
                for (let x = 0; x < 10000; x += 64) {
                    const ground = this.platforms.create(x, 568, 'ground');
                    ground.setScale(1).refreshBody();
                }
            }

            update(time, delta) {
                // Update score
                this.distance = Math.max(0, this.player.x - 100);
                this.score = Math.floor(this.distance / 10);
                
                // Update high score
                const highScore = localStorage.getItem('highScore') || 0;
                if (this.score > highScore) {
                    localStorage.setItem('highScore', this.score);
                }

                // Update UI
                let statusText = `Score: ${this.score}\nDistance: ${Math.floor(this.distance)}m`;
                if (!this.hasDoubleJump) statusText += '\n✈️ Used Double Jump';
                if (this.isInvincible) statusText += '\n🛡️ Shield Active';
                if (this.magnetActive) statusText += '\n🧲 Magnet Active';
                if (this.isSliding) statusText += '\n🏃 Sliding';
                statusText += `\nHigh Score: ${highScore}`;
                this.scoreText.setText(statusText);

                // Sliding
                if (this.downKey.isDown && this.player.body.touching.down && !this.isSliding) {
                    this.startSliding();
                }

                // Jumping
                if (this.spaceKey.isDown && this.player.body.touching.down && !this.isSliding) {
                    this.player.setVelocityY(-this.jumpPower);
                }

                // Double jump
                if (Phaser.Input.Keyboard.JustDown(this.spaceKey) && !this.player.body.touching.down && this.hasDoubleJump) {
                    this.player.setVelocityY(-this.jumpPower * 0.7);
                    this.hasDoubleJump = false;
                    this.emitter.explode(10, this.player.x, this.player.y);
                    console.log("Double jump activated!");
                }

                // Reset double jump when landing
                if (this.player.body.touching.down) {
                    this.hasDoubleJump = true;
                }

                // Keep moving forward
                if (this.player.body.velocity.x < this.gameSpeed) {
                    this.player.setVelocityX(this.gameSpeed);
                }

                // Magnet: Attract nearby coins
                if (this.magnetActive) {
                    this.coins.children.entries.forEach(coin => {
                        const distance = Phaser.Math.Distance.Between(this.player.x, this.player.y, coin.x, coin.y);
                        if (distance < 150) {
                            this.tweens.add({ 
                                targets: coin, 
                                x: this.player.x, 
                                y: this.player.y, 
                                duration: 300,
                                ease: 'Power2'
                            });
                        }
                    });
                }

                // Spawn obstacles
                if (this.player.x > this.nextObstacleX - 400) {
                    this.spawnObstacle();
                    this.nextObstacleX = this.player.x + 400 + Math.random() * 600;
                }

                // Spawn coins
                if (this.player.x > this.nextCoinX - 300) {
                    this.spawnCoin();
                    this.nextCoinX = this.player.x + 200 + Math.random() * 400;
                }

                // Spawn power-ups
                if (this.player.x > this.nextPowerUpX - 400) {
                    this.spawnPowerUp();
                    this.nextPowerUpX = this.player.x + 1000 + Math.random() * 2000;
                }

                // Spawn gamble orbs
                if (this.player.x > this.nextGambleX - 400) {
                    this.spawnGambleOrb();
                    this.nextGambleX = this.player.x + 1500 + Math.random() * 3000;
                }

                // Clean up
                this.cleanupObjects();

                // Increase speed gradually
                if (this.gameSpeed < 350) {
                    this.gameSpeed += delta * 0.005;
                }
            }

            startSliding() {
                this.isSliding = true;
                this.player.setScale(1.2, 0.6);
                
                this.time.delayedCall(1500, () => {
                    this.isSliding = false;
                    this.player.setScale(1.2);
                });
            }

            spawnObstacle() {
                // Random obstacle type with varied spawning
                const type = Math.random();
                let texture, obsY = 528, obstacleType;
                
                if (type < 0.4) { 
                    texture = 'low_obstacle'; 
                    obstacleType = 'low'; 
                } else if (type < 0.8) { 
                    texture = 'high_obstacle'; 
                    obsY = 488; 
                    obstacleType = 'high'; 
                } else { 
                    texture = 'flying_obstacle'; 
                    obsY = 400 + Math.random() * 100; 
                    obstacleType = 'flying'; 
                }
                
                const obstacle = this.obstacles.create(this.nextObstacleX, obsY, texture);
                obstacle.obstacleType = obstacleType;
                
                // Set collision box based on type
                if (obstacleType === 'high') {
                    obstacle.body.setSize(35, 75);
                } else if (obstacleType === 'flying') {
                    obstacle.body.setSize(45, 18);
                } else {
                    obstacle.body.setSize(35, 35);
                }
                
                obstacle.refreshBody();
                console.log(`${texture} (${obstacleType}) spawned at Y:${obsY}`);
            }

            spawnCoin() {
                const coinY = 400 + Math.random() * 100; // Random height between 400-500
                
                const coin = this.coins.create(this.nextCoinX, coinY, 'coin');
                coin.body.setSize(25, 25);
                
                this.tweens.add({
                    targets: coin,
                    y: coinY - 20,
                    duration: 1000,
                    yoyo: true,
                    repeat: -1,
                    ease: 'Sine.easeInOut'
                });
            }

            spawnPowerUp() {
                const type = Math.random() > 0.5 ? 'magnet' : 'shield';
                const powerUpY = 450 + Math.random() * 50; // Random height
                const powerUp = this.powerUps.create(this.nextPowerUpX, powerUpY, type);
                powerUp.powerType = type;
                powerUp.body.setSize(25, 25);
                
                // Add glowing pulse effect
                this.tweens.add({
                    targets: powerUp,
                    scaleX: 1.3,
                    scaleY: 1.3,
                    duration: 800,
                    yoyo: true,
                    repeat: -1,
                    ease: 'Sine.easeInOut'
                });
                
                console.log(`${type} power-up spawned`);
            }

            collectPowerUp(player, powerUp) {
                powerUp.destroy();
                this.emitter.explode(20, player.x, player.y); // Sparkles
                
                if (powerUp.powerType === 'magnet') {
                    this.magnetActive = true;
                    this.time.delayedCall(5000, () => {
                        this.magnetActive = false;
                        console.log("Magnet deactivated");
                    });
                    console.log("Magnet activated for 5 seconds!");
                } else if (powerUp.powerType === 'shield') {
                    this.isInvincible = true;
                    player.setTint(0x00FF00); // Green tint
                    this.time.delayedCall(3000, () => {
                        this.isInvincible = false;
                        player.clearTint();
                        console.log("Shield deactivated");
                    });
                    console.log("Shield activated for 3 seconds!");
                }
                
                this.score += 100; // Bonus points
            }

            spawnGambleOrb() {
                const orbY = 450 + Math.random() * 50; // Random height
                const orb = this.gambleOrbs.create(this.nextGambleX, orbY, 'gamble_orb');
                orb.body.setSize(25, 25);
                
                // Float animation
                this.tweens.add({
                    targets: orb,
                    y: orbY - 20,
                    duration: 1000,
                    yoyo: true,
                    repeat: -1,
                    ease: 'Sine.easeInOut'
                });
                
                // Add rotation
                this.tweens.add({
                    targets: orb,
                    rotation: Math.PI * 2,
                    duration: 2000,
                    repeat: -1,
                    ease: 'Linear'
                });
                
                console.log("Gamble orb spawned");
            }

            triggerGamble(player, orb) {
                orb.destroy();
                
                // Show gamble prompt
                const gambleText = this.add.text(player.x, player.y - 50, 'Press G to Gamble!\n(Double or Half Score)', {
                    fontSize: '16px',
                    fill: '#FF00FF',
                    backgroundColor: '#FFFFFF',
                    padding: { x: 8, y: 4 },
                    align: 'center'
                });
                
                // Auto-remove prompt after 3 seconds
                this.time.delayedCall(3000, () => {
                    if (gambleText && gambleText.active) {
                        gambleText.destroy();
                    }
                });
                
                // Listen for G key
                const gambleHandler = () => {
                    if (this.gKey.isDown) {
                        const win = Math.random() < 0.29; // ~7% house edge (EV ≈0.93)
                        
                        if (win) {
                            this.score = Math.floor(this.score * 2);
                            this.emitter.explode(30, player.x, player.y); // Success sparkles
                            
                            const winText = this.add.text(player.x, player.y - 80, 'GAMBLE WIN!\nScore Doubled!', {
                                fontSize: '18px',
                                fill: '#00FF00',
                                fontStyle: 'bold'
                            });
                            this.tweens.add({
                                targets: winText,
                                y: player.y - 120,
                                alpha: 0,
                                duration: 2000,
                                onComplete: () => winText.destroy()
                            });
                            
                            console.log("Gamble win! Score doubled to:", this.score);
                        } else {
                            this.score = Math.floor(this.score / 2);
                            this.emitter.explode(15, player.x, player.y); // Failure explosion
                            
                            const loseText = this.add.text(player.x, player.y - 80, 'GAMBLE LOSE!\nScore Halved!', {
                                fontSize: '18px',
                                fill: '#FF0000',
                                fontStyle: 'bold'
                            });
                            this.tweens.add({
                                targets: loseText,
                                y: player.y - 120,
                                alpha: 0,
                                duration: 2000,
                                onComplete: () => loseText.destroy()
                            });
                            
                            console.log("Gamble lose! Score halved to:", this.score);
                        }
                        
                        gambleText.destroy();
                        this.input.keyboard.off('keydown-G', gambleHandler);
                    }
                };
                
                this.input.keyboard.on('keydown-G', gambleHandler);
                console.log("Gamble orb triggered! Press G to gamble.");
            }

            hitObstacle(player, obstacle) {
                // Check if invincible (shield power-up)
                if (this.isInvincible) {
                    console.log("Shield protected from obstacle!");
                    obstacle.destroy();
                    this.emitter.explode(15, obstacle.x, obstacle.y); // Destruction effect
                    return; // No collision
                }
                
                // Check avoidance mechanics with tolerance
                const verticalDiff = Math.abs(player.y - obstacle.y);
                if (obstacle.obstacleType === 'high' && this.isSliding && verticalDiff < 20) {
                    console.log("Slid under high obstacle!");
                    return; // Avoided
                }
                
                if ((obstacle.obstacleType === 'low' || obstacle.obstacleType === 'flying') && !player.body.touching.down && verticalDiff > 20) {
                    console.log("Jumped over low/flying obstacle!");
                    return; // Avoided
                }
                
                // Game over with bet resolution
                if (this.betPlaced) {
                    if (this.distance > 1000 && Math.random() < 0.93) { // 93% payout prob for edge
                        console.log("Bet won! Double ETH (placeholder)");
                    } else {
                        console.log("Bet lost");
                    }
                }
                this.physics.pause();
                this.player.setTint(0xff0000);
                
                const gameOverText = this.add.text(this.player.x, this.player.y - 100, 
                    `GAME OVER!\nScore: ${this.score}\nPress R to Restart`, {
                    fontSize: '24px',
                    fill: '#ff0000',
                    backgroundColor: '#fff',
                    padding: { x: 15, y: 8 },
                    align: 'center'
                });
                gameOverText.setOrigin(0.5);

                this.rKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.R);
                this.rKey.on('down', () => {
                    this.scene.restart();
                });
            }

            collectCoin(player, coin) {
                coin.destroy();
                this.score += 50;
                this.emitter.explode(10, coin.x, coin.y); // Sparkles
                console.log("Coin collected with sparkles!");
            }

            cleanupObjects() {
                const cleanupDistance = this.player.x - 1000;

                this.obstacles.children.entries.forEach(obstacle => {
                    if (obstacle.x < cleanupDistance) {
                        obstacle.destroy();
                    }
                });

                this.coins.children.entries.forEach(coin => {
                    if (coin.x < cleanupDistance) {
                        coin.destroy();
                    }
                });

                this.powerUps.children.entries.forEach(powerUp => {
                    if (powerUp.x < cleanupDistance) {
                        powerUp.destroy();
                    }
                });

                this.gambleOrbs.children.entries.forEach(orb => {
                    if (orb.x < cleanupDistance) {
                        orb.destroy();
                    }
                });
            }
        }

        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            parent: 'game-container',
            backgroundColor: '#87CEEB',
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 1000 },
                    debug: false
                }
            },
            scene: GameScene
        };

        const game = new Phaser.Game(config);
    </script>
</body>
</html>
