<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duck Runner - Lanes & Sliding</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #87CEEB;
            font-family: Arial, sans-serif;
        }
        #game-container {
            border: 3px solid #333;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .instructions {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }
    </style>
</head>
<body>
    <div>
        <div class="instructions">
            <h2>🦆 Duck Runner - Advanced Edition 🦆</h2>
            <p>SPACE: Jump/Double Jump | UP/DOWN: Switch Lanes | HOLD DOWN: Slide | G: Gamble</p>
            <p>🧲 Green = Magnet | 🛡️ Blue = Shield | 🎰 Purple = Gamble Orb</p>
        </div>
        <div id="game-container"></div>
    </div>

    <script>
        class GameScene extends Phaser.Scene {
            constructor() {
                super({ key: 'GameScene' });
                this.player = null;
                this.platforms = null;
                this.obstacles = null;
                this.coins = null;
                this.score = 0;
                this.distance = 0;
                this.scoreText = null;
                this.gameSpeed = 200;
                this.jumpPower = 600;
                this.nextObstacleX = 600;
                this.nextCoinX = 400;
                
                // Lane system
                this.lanes = [450, 520, 590]; // Three lane Y positions
                this.currentLane = 1; // Start in middle lane
                
                // Advanced mechanics
                this.isSliding = false;
                this.powerUps = null;
                this.gambleOrbs = null;
                this.nextPowerUpX = 1000;
                this.nextGambleX = 1500;
                this.hasDoubleJump = true; // Reset on land
                this.isInvincible = false;
                this.magnetActive = false;
                this.currentTheme = 'farm'; // For background tint
                this.gKey = null;
                this.emitter = null; // Particles
            }

            preload() {
                this.createAssets();
            }

            createAssets() {
                // Duck sprite (bright yellow rectangle)
                this.add.graphics()
                    .fillStyle(0xFFFF00)
                    .fillRect(0, 0, 50, 40)
                    .fillStyle(0xFF8C00) // Orange beak
                    .fillTriangle(0, 20, 15, 15, 15, 25)
                    .fillStyle(0x000000) // Black eye
                    .fillCircle(35, 15, 3)
                    .generateTexture('duck', 50, 40);

                // Ground tile (brown)
                this.add.graphics()
                    .fillStyle(0x8B4513)
                    .fillRect(0, 0, 64, 64)
                    .generateTexture('ground', 64, 64);

                // Regular low obstacles (jump over)
                this.add.graphics()
                    .fillStyle(0xFF0000)
                    .fillRect(0, 0, 40, 40)
                    .generateTexture('low_obstacle', 40, 40);

                // High obstacles (slide under)
                this.add.graphics()
                    .fillStyle(0xFF0000)
                    .fillRect(0, 0, 40, 80)
                    .generateTexture('high_obstacle', 40, 80);

                // Coins
                this.add.graphics()
                    .fillStyle(0xFFD700)
                    .fillCircle(15, 15, 15)
                    .generateTexture('coin', 30, 30);

                // Hills (farm green)
                this.add.graphics()
                    .fillStyle(0x228B22)
                    .fillRoundedRect(0, 0, 200, 100, 20)
                    .generateTexture('hill_farm', 200, 100);

                // Clouds (multiple circles for puffy look)
                this.add.graphics()
                    .fillStyle(0xFFFFFF)
                    .fillCircle(50, 50, 50)
                    .fillCircle(80, 60, 30)
                    .fillCircle(30, 60, 30)
                    .generateTexture('cloud', 100, 100);

                // Power-ups: Magnet (green square)
                this.add.graphics()
                    .fillStyle(0x00FF00)
                    .fillRect(0, 0, 30, 30)
                    .fillStyle(0x004400)
                    .fillRect(5, 5, 20, 20)
                    .generateTexture('magnet', 30, 30);

                // Power-ups: Shield (blue circle)
                this.add.graphics()
                    .fillStyle(0x0000FF)
                    .fillCircle(15, 15, 15)
                    .fillStyle(0x4444FF)
                    .fillCircle(15, 15, 10)
                    .generateTexture('shield', 30, 30);

                // Gamble orb (magenta circle)
                this.add.graphics()
                    .fillStyle(0xFF00FF)
                    .fillCircle(15, 15, 15)
                    .fillStyle(0xFF44FF)
                    .fillCircle(15, 15, 10)
                    .generateTexture('gamble_orb', 30, 30);

                // Rolling obstacle (red circle)
                this.add.graphics()
                    .fillStyle(0xFF0000)
                    .fillCircle(20, 20, 20)
                    .fillStyle(0x880000)
                    .fillCircle(20, 20, 15)
                    .generateTexture('rolling_obstacle', 40, 40);

                // Flying obstacle (red rectangle)
                this.add.graphics()
                    .fillStyle(0xFF0000)
                    .fillRect(0, 0, 50, 20)
                    .fillStyle(0x880000)
                    .fillRect(5, 5, 40, 10)
                    .generateTexture('flying_obstacle', 50, 20);

                // Particles (yellow dots for feathers/sparkles)
                this.add.graphics()
                    .fillStyle(0xFFFF00)
                    .fillCircle(5, 5, 5)
                    .generateTexture('particle', 10, 10);
            }

            create() {
                // Set world bounds
                this.physics.world.setBounds(0, 0, 10000, 600);

                // Create physics groups
                this.platforms = this.physics.add.staticGroup();
                this.obstacles = this.physics.add.staticGroup();
                this.coins = this.physics.add.group();
                this.powerUps = this.physics.add.group();
                this.gambleOrbs = this.physics.add.group();

                // Create ground
                this.createGround();

                // Create player duck in middle lane
                this.player = this.physics.add.sprite(100, this.lanes[this.currentLane], 'duck');
                this.player.setBounce(0);
                this.player.setCollideWorldBounds(true);
                this.player.body.setSize(45, 35);
                this.player.setScale(1.2);
                this.player.setVelocityX(this.gameSpeed);

                console.log("Duck created at lane", this.currentLane, "Y position:", this.player.y);

                // Collisions
                this.physics.add.collider(this.player, this.platforms);
                this.physics.add.collider(this.player, this.obstacles, this.hitObstacle, null, this);
                this.physics.add.overlap(this.player, this.coins, this.collectCoin, null, this);
                this.physics.add.overlap(this.player, this.powerUps, this.collectPowerUp, null, this);
                this.physics.add.overlap(this.player, this.gambleOrbs, this.triggerGamble, null, this);

                // Controls
                this.spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
                this.upKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.UP);
                this.downKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.DOWN);
                this.gKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.G);

                // Parallax backgrounds (behind duck)
                this.hills = this.add.tileSprite(0, 400, 800, 200, 'hill_farm').setScrollFactor(0.5);
                this.clouds = this.add.tileSprite(0, 100, 800, 200, 'cloud').setScrollFactor(0.2);

                // Particle emitter for effects
                this.emitter = this.add.particles(0, 0, 'particle', { 
                    speed: 100, 
                    lifespan: 500, 
                    quantity: 10, 
                    scale: { start: 1, end: 0 } 
                });

                // Camera follows duck
                this.cameras.main.startFollow(this.player);
                this.cameras.main.setFollowOffset(-200, 0);

                // UI
                this.scoreText = this.add.text(16, 16, 'Score: 0', {
                    fontSize: '18px',
                    fill: '#000',
                    backgroundColor: '#fff',
                    padding: { x: 10, y: 5 }
                });
                this.scoreText.setScrollFactor(0);

                console.log("Game ready!");
            }

            createGround() {
                // Create ground at bottom
                for (let x = 0; x < 10000; x += 64) {
                    const ground = this.platforms.create(x, 630, 'ground');
                    ground.setScale(1).refreshBody();
                }
            }

            update(time, delta) {
                // Update score
                this.distance = Math.max(0, this.player.x - 100);
                this.score = Math.floor(this.distance / 10);
                
                // Update UI
                let statusText = `Score: ${this.score}\nDistance: ${Math.floor(this.distance)}m\nLane: ${this.currentLane + 1}/3\nTheme: ${this.currentTheme}`;
                if (this.isSliding) statusText += '\n🏃 Sliding';
                if (this.isInvincible) statusText += '\n🛡️ Shield';
                if (this.magnetActive) statusText += '\n🧲 Magnet';
                if (!this.hasDoubleJump) statusText += '\n✈️ Used Double Jump';
                this.scoreText.setText(statusText);

                // Lane switching with UP/DOWN arrows
                if (Phaser.Input.Keyboard.JustDown(this.upKey) && this.currentLane > 0) {
                    this.currentLane--;
                    this.tweens.add({
                        targets: this.player,
                        y: this.lanes[this.currentLane],
                        duration: 200,
                        ease: 'Power2'
                    });
                    console.log("Switched to lane", this.currentLane);
                }

                if (Phaser.Input.Keyboard.JustDown(this.downKey) && this.currentLane < 2) {
                    this.currentLane++;
                    this.tweens.add({
                        targets: this.player,
                        y: this.lanes[this.currentLane],
                        duration: 200,
                        ease: 'Power2'
                    });
                    console.log("Switched to lane", this.currentLane);
                }

                // Sliding (hold DOWN while on ground)
                if (this.downKey.isDown && this.player.body.touching.down && !this.isSliding) {
                    this.startSliding();
                }

                // Jumping (SPACE while on ground and not sliding)
                if (this.spaceKey.isDown && this.player.body.touching.down && !this.isSliding) {
                    this.player.setVelocityY(-this.jumpPower);
                    console.log("Duck jumped!");
                }

                // Double jump (SPACE while in air and still has double jump)
                if (Phaser.Input.Keyboard.JustDown(this.spaceKey) && !this.player.body.touching.down && this.hasDoubleJump) {
                    this.player.setVelocityY(-this.jumpPower * 0.7);
                    this.hasDoubleJump = false;
                    this.emitter.explode(10, this.player.x, this.player.y); // Feathers
                    console.log("Double jump!");
                }

                // Reset double jump when landing
                if (this.player.body.touching.down) {
                    this.hasDoubleJump = true;
                }

                // Keep duck moving forward
                if (this.player.body.velocity.x < this.gameSpeed) {
                    this.player.setVelocityX(this.gameSpeed);
                }

                // Theme shifting based on distance
                if (this.distance > 2000 && this.currentTheme === 'farm') {
                    this.currentTheme = 'river';
                    this.cameras.main.setBackgroundColor('#00BFFF'); // Blue tint
                    console.log("Theme changed to river!");
                } else if (this.distance > 4000 && this.currentTheme === 'river') {
                    this.currentTheme = 'mine';
                    this.cameras.main.setBackgroundColor('#FFD700'); // Gold tint
                    console.log("Theme changed to mine!");
                }

                // Parallax background scrolling
                this.hills.tilePositionX += this.gameSpeed * 0.0005 * delta;
                this.clouds.tilePositionX += this.gameSpeed * 0.0002 * delta;

                // Magnet: Attract coins to player
                if (this.magnetActive) {
                    this.coins.children.entries.forEach(coin => {
                        if (Phaser.Math.Distance.Between(this.player.x, this.player.y, coin.x, coin.y) < 150) {
                            this.tweens.add({ 
                                targets: coin, 
                                x: this.player.x, 
                                y: this.player.y, 
                                duration: 300,
                                ease: 'Power2'
                            });
                        }
                    });
                }

                // Spawn obstacles
                if (this.player.x > this.nextObstacleX - 400) {
                    this.spawnObstacle();
                    this.nextObstacleX = this.player.x + 400 + Math.random() * 600;
                }

                // Spawn coins
                if (this.player.x > this.nextCoinX - 300) {
                    this.spawnCoin();
                    this.nextCoinX = this.player.x + 200 + Math.random() * 400;
                }

                // Spawn power-ups
                if (this.player.x > this.nextPowerUpX - 400) {
                    this.spawnPowerUp();
                    this.nextPowerUpX = this.player.x + 1000 + Math.random() * 2000;
                }

                // Spawn gamble orbs
                if (this.player.x > this.nextGambleX - 400) {
                    this.spawnGambleOrb();
                    this.nextGambleX = this.player.x + 1500 + Math.random() * 3000;
                }

                // Clean up old objects
                this.cleanupObjects();

                // Gradually increase speed
                if (this.gameSpeed < 350) {
                    this.gameSpeed += delta * 0.005;
                }
            }

            startSliding() {
                this.isSliding = true;
                this.player.setScale(1.2, 0.6); // Flatten duck
                console.log("Started sliding!");
                
                this.time.delayedCall(1500, () => {
                    this.isSliding = false;
                    this.player.setScale(1.2);
                    console.log("Stopped sliding");
                });
            }

            spawnObstacle() {
                // Random lane and obstacle type with varied types
                const obstacleLane = Math.floor(Math.random() * 3);
                const type = Math.random(); // <0.4 low, 0.4-0.7 high, 0.7-0.85 rolling, >0.85 flying
                
                let texture, obsY, velocity = 0;
                
                if (type < 0.4) { 
                    texture = 'low_obstacle'; 
                    obsY = this.lanes[obstacleLane] + 40; 
                } else if (type < 0.7) { 
                    texture = 'high_obstacle'; 
                    obsY = this.lanes[obstacleLane] + 20; 
                } else if (type < 0.85) { 
                    texture = 'rolling_obstacle'; 
                    obsY = this.lanes[obstacleLane] + 40; 
                    velocity = -100; // Rolls left
                } else { 
                    texture = 'flying_obstacle'; 
                    obsY = this.lanes[obstacleLane] - 50; 
                    velocity = -50; // Slow fly
                }
                
                const obstacle = this.obstacles.create(this.nextObstacleX, obsY, texture);
                obstacle.setVelocityX(velocity); // For moving ones
                obstacle.obstacleType = type < 0.4 ? 'low' : type < 0.7 ? 'high' : type < 0.85 ? 'rolling' : 'flying';
                obstacle.obstacleLane = obstacleLane;
                
                // Set collision box based on type
                if (texture === 'high_obstacle') {
                    obstacle.body.setSize(35, 75);
                } else if (texture === 'flying_obstacle') {
                    obstacle.body.setSize(45, 18);
                } else {
                    obstacle.body.setSize(35, 35);
                }
                
                obstacle.refreshBody();
                console.log(`${texture} (${obstacle.obstacleType}) spawned in lane ${obstacleLane} at X:${obstacle.x}`);
            }

            spawnCoin() {
                const coinLane = Math.floor(Math.random() * 3);
                const coinY = this.lanes[coinLane] - 30; // Above the lane
                
                const coin = this.coins.create(this.nextCoinX, coinY, 'coin');
                coin.body.setSize(25, 25);
                
                // Floating animation
                this.tweens.add({
                    targets: coin,
                    y: coinY - 20,
                    duration: 1000,
                    yoyo: true,
                    repeat: -1,
                    ease: 'Sine.easeInOut'
                });
                
                console.log(`Coin spawned in lane ${coinLane}`);
            }

            spawnPowerUp() {
                const type = Math.random() > 0.5 ? 'magnet' : 'shield';
                const lane = Math.floor(Math.random() * 3);
                const powerUp = this.powerUps.create(this.nextPowerUpX, this.lanes[lane] - 30, type);
                powerUp.powerType = type;
                powerUp.body.setSize(25, 25);
                
                // Add glowing pulse effect
                this.tweens.add({
                    targets: powerUp,
                    scaleX: 1.3,
                    scaleY: 1.3,
                    duration: 800,
                    yoyo: true,
                    repeat: -1,
                    ease: 'Sine.easeInOut'
                });
                
                console.log(`${type} power-up spawned in lane ${lane}`);
            }

            collectPowerUp(player, powerUp) {
                powerUp.destroy();
                this.emitter.explode(20, player.x, player.y); // Sparkles
                
                if (powerUp.powerType === 'magnet') {
                    this.magnetActive = true;
                    this.time.delayedCall(5000, () => {
                        this.magnetActive = false;
                        console.log("Magnet deactivated");
                    });
                    console.log("Magnet activated for 5 seconds!");
                } else if (powerUp.powerType === 'shield') {
                    this.isInvincible = true;
                    player.setTint(0x00FF00); // Green tint
                    this.time.delayedCall(3000, () => {
                        this.isInvincible = false;
                        player.clearTint();
                        console.log("Shield deactivated");
                    });
                    console.log("Shield activated for 3 seconds!");
                }
                
                this.score += 100; // Bonus points
            }

            spawnGambleOrb() {
                const lane = Math.floor(Math.random() * 3);
                const orb = this.gambleOrbs.create(this.nextGambleX, this.lanes[lane] - 50, 'gamble_orb');
                orb.body.setSize(25, 25);
                
                // Float animation like coins
                this.tweens.add({
                    targets: orb,
                    y: this.lanes[lane] - 70,
                    duration: 1000,
                    yoyo: true,
                    repeat: -1,
                    ease: 'Sine.easeInOut'
                });
                
                // Add sparkly rotation
                this.tweens.add({
                    targets: orb,
                    rotation: Math.PI * 2,
                    duration: 2000,
                    repeat: -1,
                    ease: 'Linear'
                });
                
                console.log(`Gamble orb spawned in lane ${lane}`);
            }

            triggerGamble(player, orb) {
                orb.destroy();
                
                // Show gamble prompt
                const gambleText = this.add.text(player.x, player.y - 50, 'Press G to Gamble!\n(Double or Half Score)', {
                    fontSize: '16px',
                    fill: '#FF00FF',
                    backgroundColor: '#FFFFFF',
                    padding: { x: 8, y: 4 },
                    align: 'center'
                });
                
                // Auto-remove prompt after 3 seconds
                this.time.delayedCall(3000, () => {
                    if (gambleText && gambleText.active) {
                        gambleText.destroy();
                    }
                });
                
                // Listen for G key
                const gambleHandler = () => {
                    if (this.gKey.isDown) {
                        const win = Math.random() < 0.45; // 45% win rate (10% house edge, not 7% as claimed)
                        
                        if (win) {
                            this.score = Math.floor(this.score * 2);
                            this.emitter.explode(30, player.x, player.y); // Success sparkles
                            
                            const winText = this.add.text(player.x, player.y - 80, 'GAMBLE WIN!\nScore Doubled!', {
                                fontSize: '18px',
                                fill: '#00FF00',
                                fontStyle: 'bold'
                            });
                            this.tweens.add({
                                targets: winText,
                                y: player.y - 120,
                                alpha: 0,
                                duration: 2000,
                                onComplete: () => winText.destroy()
                            });
                            
                            console.log("Gamble win! Score doubled to:", this.score);
                        } else {
                            this.score = Math.floor(this.score / 2);
                            this.emitter.explode(15, player.x, player.y); // Failure explosion
                            
                            const loseText = this.add.text(player.x, player.y - 80, 'GAMBLE LOSE!\nScore Halved!', {
                                fontSize: '18px',
                                fill: '#FF0000',
                                fontStyle: 'bold'
                            });
                            this.tweens.add({
                                targets: loseText,
                                y: player.y - 120,
                                alpha: 0,
                                duration: 2000,
                                onComplete: () => loseText.destroy()
                            });
                            
                            console.log("Gamble lose! Score halved to:", this.score);
                        }
                        
                        gambleText.destroy();
                        this.input.keyboard.off('keydown-G', gambleHandler);
                    }
                };
                
                this.input.keyboard.on('keydown-G', gambleHandler);
                
                console.log("Gamble orb triggered! Press G to gamble.");
            }

            hitObstacle(player, obstacle) {
                // Check if invincible (shield power-up)
                if (this.isInvincible) {
                    console.log("Shield protected from obstacle!");
                    obstacle.destroy();
                    this.emitter.explode(15, obstacle.x, obstacle.y); // Destruction effect
                    return; // No collision
                }
                
                // Check if we can avoid the obstacle
                if (obstacle.obstacleType === 'high' && this.isSliding) {
                    console.log("Slid under high obstacle!");
                    return; // No collision
                }
                
                if ((obstacle.obstacleType === 'low' || obstacle.obstacleType === 'rolling') && !this.player.body.touching.down) {
                    console.log("Jumped over low/rolling obstacle!");
                    return; // No collision
                }
                
                if (obstacle.obstacleType === 'flying') {
                    // Flying obstacles can be avoided by jumping (if high enough) or sliding (if low enough)
                    if (!this.player.body.touching.down || this.isSliding) {
                        console.log("Avoided flying obstacle!");
                        return; // No collision
                    }
                }
                
                // Check if we're in the same lane
                const playerLane = this.currentLane;
                const obstacleIsInPlayerLane = Math.abs(this.player.y - this.lanes[obstacle.obstacleLane]) < 40;
                
                if (!obstacleIsInPlayerLane) {
                    console.log("Obstacle in different lane - safe!");
                    return; // No collision if in different lane
                }
                
                // Actual collision
                console.log("Hit obstacle! Game Over!");
                this.physics.pause();
                this.player.setTint(0xff0000);
                
                const gameOverText = this.add.text(this.player.x, this.player.y - 100, 
                    `GAME OVER!\nFinal Score: ${this.score}\nDistance: ${Math.floor(this.distance)}m\n\nPress R to Restart`, {
                    fontSize: '24px',
                    fill: '#ff0000',
                    backgroundColor: '#fff',
                    padding: { x: 15, y: 8 },
                    align: 'center'
                });
                gameOverText.setOrigin(0.5);

                this.rKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.R);
                this.rKey.on('down', () => {
                    this.scene.restart();
                });
            }

            collectCoin(player, coin) {
                coin.destroy();
                this.score += 50;
                console.log("Coin collected! +50 points");
                
                // Visual feedback
                const bonusText = this.add.text(coin.x, coin.y, '+50', {
                    fontSize: '16px',
                    fill: '#FFD700',
                    fontStyle: 'bold'
                });
                
                this.tweens.add({
                    targets: bonusText,
                    y: coin.y - 50,
                    alpha: 0,
                    duration: 1000,
                    onComplete: () => bonusText.destroy()
                });
            }

            cleanupObjects() {
                const cleanupDistance = this.player.x - 1000;

                this.obstacles.children.entries.forEach(obstacle => {
                    if (obstacle.x < cleanupDistance) {
                        obstacle.destroy();
                    }
                });

                this.coins.children.entries.forEach(coin => {
                    if (coin.x < cleanupDistance) {
                        coin.destroy();
                    }
                });

                this.powerUps.children.entries.forEach(powerUp => {
                    if (powerUp.x < cleanupDistance) {
                        powerUp.destroy();
                    }
                });

                this.gambleOrbs.children.entries.forEach(orb => {
                    if (orb.x < cleanupDistance) {
                        orb.destroy();
                    }
                });
            }
        }

        // Game configuration
        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            parent: 'game-container',
            backgroundColor: '#87CEEB',
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 1500 },
                    debug: false
                }
            },
            scene: GameScene
        };

        console.log("Starting lane-based duck runner...");
        const game = new Phaser.Game(config);
    </script>
</body>
</html>
