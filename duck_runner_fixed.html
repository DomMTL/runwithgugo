<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duck Runner - FIXED VERSION</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #87CEEB;
            font-family: Arial, sans-serif;
        }
        #game-container {
            border: 3px solid #333;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .instructions {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }
    </style>
</head>
<body>
    <div>
        <div class="instructions">
            <h2>🦆 Duck Runner - FIXED! 🦆</h2>
            <p>Press SPACEBAR to jump over obstacles! Collect coins for bonus points!</p>
        </div>
        <div id="game-container"></div>
    </div>

    <script>
        class GameScene extends Phaser.Scene {
            constructor() {
                super({ key: 'GameScene' });
                this.player = null;
                this.platforms = null;
                this.obstacles = null;
                this.coins = null;
                this.score = 0;
                this.distance = 0;
                this.scoreText = null;
                this.gameSpeed = 200;
                this.jumpPower = 600;
                this.obstacleTimer = 0;
                this.coinTimer = 0;
                this.worldX = 0; // Track world movement instead of camera
            }

            preload() {
                this.createAssets();
            }

            createAssets() {
                // Duck sprite (bright yellow rectangle - we know this works!)
                this.add.graphics()
                    .fillStyle(0xFFFF00)
                    .fillRect(0, 0, 50, 40)
                    .fillStyle(0xFF8C00) // Orange beak
                    .fillTriangle(0, 20, 15, 15, 15, 25)
                    .fillStyle(0x000000) // Black eye
                    .fillCircle(35, 15, 3)
                    .generateTexture('duck', 50, 40);

                // Ground tile (brown)
                this.add.graphics()
                    .fillStyle(0x8B4513)
                    .fillRect(0, 0, 64, 64)
                    .fillStyle(0x654321)
                    .fillRect(0, 0, 64, 8)
                    .generateTexture('ground', 64, 64);

                // Obstacles
                this.add.graphics()
                    .fillStyle(0xFF0000)
                    .fillRect(0, 0, 40, 40)
                    .generateTexture('obstacle', 40, 40);

                // Coins
                this.add.graphics()
                    .fillStyle(0xFFD700)
                    .fillCircle(15, 15, 15)
                    .generateTexture('coin', 30, 30);
            }

            create() {
                // Create physics groups - use regular group for platforms so they can move
                this.platforms = this.physics.add.group();
                this.obstacles = this.physics.add.group();
                this.coins = this.physics.add.group();

                // Create initial ground
                this.createGround();

                // Create player duck - KEEP IN FIXED POSITION ON SCREEN
                this.player = this.physics.add.sprite(150, 500, 'duck');
                this.player.setBounce(0);
                this.player.setCollideWorldBounds(false); // Don't constrain to world
                this.player.body.setSize(45, 35);
                this.player.setScale(1.2);

                console.log("Duck created at:", this.player.x, this.player.y);
                console.log("Ground is at y=568, duck is at y=500");

                // Collisions
                this.physics.add.collider(this.player, this.platforms);
                this.physics.add.collider(this.player, this.obstacles, this.hitObstacle, null, this);
                this.physics.add.overlap(this.player, this.coins, this.collectCoin, null, this);

                // Controls
                this.spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);

                // UI - Fixed to screen (no scroll factor)
                this.scoreText = this.add.text(16, 16, 'Score: 0\nDistance: 0m', {
                    fontSize: '18px',
                    fill: '#000',
                    backgroundColor: '#fff',
                    padding: { x: 10, y: 5 }
                });
                this.scoreText.setScrollFactor(0);

                this.add.text(400, 50, 'Press SPACEBAR to Jump!', {
                    fontSize: '16px',
                    fill: '#333',
                    backgroundColor: '#fff',
                    padding: { x: 8, y: 4 }
                }).setOrigin(0.5, 0).setScrollFactor(0);

                // DON'T move the camera - instead move the world objects!
                console.log("Game setup complete - duck should be visible!");
            }

            createGround() {
                // Create ground extending far to the right
                for (let x = -200; x < 2000; x += 64) {
                    const ground = this.platforms.create(x, 568, 'ground');
                    ground.setScale(1);
                    ground.body.setImmovable(true); // Make immovable but still moveable
                    ground.body.velocity.x = -this.gameSpeed;
                }
            }

            update(time, delta) {
                // Update score based on time
                this.distance += this.gameSpeed * delta / 1000;
                this.score = Math.floor(this.distance);
                this.scoreText.setText(`Score: ${this.score}\nDistance: ${Math.floor(this.distance)}m\nDuck Y: ${Math.round(this.player.y)}\nOn Ground: ${this.player.body.touching.down}`);

                // Handle jumping
                if (this.spaceKey.isDown && this.player.body.touching.down) {
                    this.player.setVelocityY(-this.jumpPower);
                    console.log("Duck jumped!");
                }

                // Move world objects LEFT using physics velocity (maintains collision)
                this.worldX += this.gameSpeed * delta / 1000;

                // Move all platforms using velocity (preserves physics)
                this.platforms.children.entries.forEach(platform => {
                    platform.body.velocity.x = -this.gameSpeed;
                });

                // Move all obstacles using velocity
                this.obstacles.children.entries.forEach(obstacle => {
                    obstacle.body.velocity.x = -this.gameSpeed;
                });

                // Move all coins using velocity
                this.coins.children.entries.forEach(coin => {
                    coin.body.velocity.x = -this.gameSpeed;
                });

                // Extend ground to the right
                this.extendGround();

                // Spawn obstacles
                this.obstacleTimer += delta;
                if (this.obstacleTimer > 2500 + Math.random() * 2000) {
                    this.spawnObstacle();
                    this.obstacleTimer = 0;
                }

                // Spawn coins
                this.coinTimer += delta;
                if (this.coinTimer > 3500 + Math.random() * 3000) {
                    this.spawnCoin();
                    this.coinTimer = 0;
                }

                // Clean up old objects
                this.cleanupObjects();

                // Gradually increase speed
                this.gameSpeed += delta * 0.02;
            }

            extendGround() {
                const rightmostGround = this.platforms.children.entries
                    .reduce((max, ground) => ground.x > max.x ? ground : max, { x: -Infinity });
                
                if (rightmostGround.x < 1000) {
                    for (let x = rightmostGround.x + 64; x < rightmostGround.x + 500; x += 64) {
                        const ground = this.platforms.create(x, 568, 'ground');
                        ground.setScale(1);
                        ground.body.setImmovable(true);
                        ground.body.velocity.x = -this.gameSpeed;
                    }
                }
            }

            spawnObstacle() {
                const obstacle = this.obstacles.create(900, 528, 'obstacle');
                obstacle.body.setSize(35, 35);
                obstacle.body.setImmovable(true);
                obstacle.body.velocity.x = -this.gameSpeed; // Set initial velocity
                console.log("Obstacle spawned at", obstacle.x);
            }

            spawnCoin() {
                const coinHeight = 400 - Math.random() * 80;
                const coin = this.coins.create(900, coinHeight, 'coin');
                coin.body.setSize(25, 25);
                coin.body.velocity.x = -this.gameSpeed; // Set initial velocity
                
                // Add floating animation
                this.tweens.add({
                    targets: coin,
                    y: coinHeight - 20,
                    duration: 1000,
                    yoyo: true,
                    repeat: -1,
                    ease: 'Sine.easeInOut'
                });
                
                console.log("Coin spawned at", coin.x, coin.y);
            }

            cleanupObjects() {
                // Remove objects that have moved off the left side
                this.obstacles.children.entries.forEach(obstacle => {
                    if (obstacle.x < -100) {
                        obstacle.destroy();
                    }
                });

                this.coins.children.entries.forEach(coin => {
                    if (coin.x < -100) {
                        coin.destroy();
                    }
                });

                this.platforms.children.entries.forEach(platform => {
                    if (platform.x < -200) {
                        platform.destroy();
                    }
                });
            }

            hitObstacle() {
                console.log("Game Over!");
                this.physics.pause();
                this.player.setTint(0xff0000);
                
                const gameOverText = this.add.text(400, 250, 'GAME OVER!\nFinal Score: ' + this.score + '\nPress R to Restart', {
                    fontSize: '28px',
                    fill: '#ff0000',
                    backgroundColor: '#fff',
                    padding: { x: 15, y: 8 },
                    align: 'center'
                });
                gameOverText.setOrigin(0.5);
                gameOverText.setScrollFactor(0);

                this.rKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.R);
                this.rKey.on('down', () => {
                    this.scene.restart();
                });
            }

            collectCoin(player, coin) {
                console.log("Coin collected!");
                coin.destroy();
                this.score += 50;
                
                // Visual feedback
                const bonusText = this.add.text(coin.x, coin.y, '+50', {
                    fontSize: '16px',
                    fill: '#FFD700',
                    fontStyle: 'bold'
                });
                
                this.tweens.add({
                    targets: bonusText,
                    y: coin.y - 50,
                    alpha: 0,
                    duration: 1000,
                    onComplete: () => bonusText.destroy()
                });
            }
        }

        // Game configuration
        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            parent: 'game-container',
            backgroundColor: '#87CEEB',
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 1500 },
                    debug: false
                }
            },
            scene: GameScene
        };

        console.log("Starting fixed duck runner...");
        const game = new Phaser.Game(config);
    </script>
</body>
</html>
